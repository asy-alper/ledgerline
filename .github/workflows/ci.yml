name: Java and PostgreSQL verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ledgerline_test
          POSTGRES_USER: ledger_test
          POSTGRES_PASSWORD: integration-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger_test -d ledgerline_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B -ntp -Pintegration verify
        env:
          TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/ledgerline_test
          TEST_DATABASE_USER: ledger_test
          TEST_DATABASE_PASSWORD: integration-only-password
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
