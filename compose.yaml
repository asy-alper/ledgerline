name: ledgerline
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline_migrator
      POSTGRES_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?Set MIGRATION_DATABASE_PASSWORD in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
    volumes:
      - ledgerline-data:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/01-runtime-role.sh:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline_migrator -d ledgerline"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    build: .
    image: ledgerline:local
    command: ["migrate"]
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ledgerline
      DATABASE_USER: ledgerline_migrator
      DATABASE_PASSWORD: ${MIGRATION_DATABASE_PASSWORD:?Set MIGRATION_DATABASE_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  api:
    image: ledgerline:local
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/ledgerline
      DATABASE_USER: ledgerline_app
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD}
      DB_MIGRATE: "false"
      DB_POOL_SIZE: ${DB_POOL_SIZE:-12}
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: "8080"
      TRUSTED_PROXY_IPS: ${TRUSTED_PROXY_IPS:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs: /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    init: true
    stop_grace_period: 20s
    restart: unless-stopped
volumes:
  ledgerline-data:
